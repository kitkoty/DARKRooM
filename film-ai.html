<div id="stage">
  <div id="light"></div>

      <button id="tabDetect" class="btn on">Identify</button>
      <button id="tabSetup" class="btn">Setup</button>
    </nav>

    <section id="panelDetect" class="panel on">
      <p class="intro">Upload a frame. The archive compares its colour, contrast and grain with the film profiles and shows the two closest matches.</p>

      <canvas id="preview"></canvas>
      <div id="results"></div>

      <p class="intro">Choose the <b>photos</b> folder once. The film name is taken from the file name.</p>
      <div class="controls">
        <label class="btn" for="dir">Choose photos folder</label>
        <input id="dir" type="file" webkitdirectory directory multiple hidden>
      </div>
      <div class="controls">
        <button id="build" class="btn">Build profiles</button>
        <button id="download" class="btn" disabled>Download profiles.json</button>
      </div>
      <div id="log">Waiting for folder...</div>
    </section>
  </div>

  function hueOf(r, g, b) {
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    if (d < 1e-6) return -1;
    var h;
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h /= 6;
    return h < 0 ? h + 1 : h;
  }

  function featuresFromPixels(data, w, h) {
    var n = w * h;
    var Y = new Float32Array(n), S = new Float32Array(n), Hs = new Float32Array(n);
    var mR = 0, mG = 0, mB = 0, i, r, g, b;

    for (i = 0; i < n; i++) {
      r = data[i * 4] / 255; g = data[i * 4 + 1] / 255; b = data[i * 4 + 2] / 255;
      mR += r; mG += g; mB += b;
      Y[i] = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      S[i] = mx > 1e-6 ? (mx - mn) / mx : 0;
      Hs[i] = hueOf(r, g, b);
    }
    mR /= n; mG /= n; mB /= n;

    var mY = 0, mS = 0;
    for (i = 0; i < n; i++) { mY += Y[i]; mS += S[i]; }
    mY /= n; mS /= n;

    var vY = 0, vS = 0;
    for (i = 0; i < n; i++) {
      var dy = Y[i] - mY; vY += dy * dy;
      var ds = S[i] - mS; vS += ds * ds;
    }
    var stdY = Math.sqrt(vY / n), stdS = Math.sqrt(vS / n);

    var BINS = 64, hist = new Uint32Array(BINS);
    for (i = 0; i < n; i++) hist[Math.min(BINS - 1, Math.floor(Y[i] * BINS))]++;
    function pct(p) {
      var target = p * n, acc = 0;
      for (var q = 0; q < BINS; q++) { acc += hist[q]; if (acc >= target) return (q + 0.5) / BINS; }
      return 1;
    }

    var clipHi = 0, clipLo = 0, satHi = 0;
    var rgS = 0, byS = 0, rgM = 0, byM = 0, rgH = 0, byH = 0;
    var nS = 0, nM = 0, nH = 0, sRG = 0, sBY = 0, sumRG = 0, sumBY = 0;

    for (i = 0; i < n; i++) {
      r = data[i * 4] / 255; g = data[i * 4 + 1] / 255; b = data[i * 4 + 2] / 255;
      var y = Y[i];
      if (y > 0.97) clipHi++;
      if (y < 0.03) clipLo++;
      if (S[i] > 0.45) satHi++;
      var rg = r - g, by = (r + g) / 2 - b;
      sumRG += rg; sumBY += by;
      sRG += rg * rg; sBY += by * by;
      if (y < 1 / 3) { rgS += rg; byS += by; nS++; }
      else if (y < 2 / 3) { rgM += rg; byM += by; nM++; }
      else { rgH += rg; byH += by; nH++; }
    }

    var meanRG = sumRG / n, meanBY = sumBY / n;
    var stdRG = Math.sqrt(Math.max(0, sRG / n - meanRG * meanRG));
    var stdBY = Math.sqrt(Math.max(0, sBY / n - meanBY * meanBY));
    var colorfulness = Math.sqrt(stdRG * stdRG + stdBY * stdBY) +
      0.3 * Math.sqrt(meanRG * meanRG + meanBY * meanBY);

    var hue = new Float64Array(HUE_BINS), hueSum = 0;
    for (i = 0; i < n; i++) {
      if (Hs[i] < 0) continue;
      var hb = Math.min(HUE_BINS - 1, Math.floor(Hs[i] * HUE_BINS));
      hue[hb] += S[i]; hueSum += S[i];
    }
    if (hueSum > 0) for (i = 0; i < HUE_BINS; i++) hue[i] /= hueSum;

    var gs = 0, gq = 0, gn = 0;
    for (var yy = 1; yy < h - 1; yy++) {
      for (var xx = 1; xx < w - 1; xx++) {
        var idx = yy * w + xx, acc = 0;
        for (var dy2 = -1; dy2 <= 1; dy2++)

    var gVar = gn ? Math.max(0, gq / gn - gMean * gMean) : 0;

      nH ? rgH / nH : 0, nH ? byH / nH : 0,

  function distance(a, b, weight) {
    var d2 = 0, w, dz;

  function predict(v, prof, examples) {
    var scored = examples.map(function (e) {
      return { label: e.label, d: distance(v, e.v, prof.weight) };
    }).sort(function (a, b) { return a.d - b.d; });

    var near = scored.slice(0, Math.min(K_NEIGHBOURS, scored.length));
    var votes = {}, total = 0, i;
    for (i = 0; i < near.length; i++) {
      var wgt = 1 / (near[i].d + 1e-6);
      votes[near[i].label] = (votes[near[i].label] || 0) + wgt;
      total += wgt;
    }

    var counts = {};
    examples.forEach(function (e) { counts[e.label] = (counts[e.label] || 0) + 1; });
    var labels = Object.keys(counts);

    var raw = labels.map(function (label) {
      var vote = (votes[label] || 0) / (total || 1);
      var prior = counts[label] / examples.length;
      return { label: label, s: vote + 0.25 * prior };
    });
    var sum = 0;
    for (i = 0; i < raw.length; i++) sum += raw[i].s;
    raw.forEach(function (r) { r.p = r.s / (sum || 1); });
    raw.sort(function (a, b) { return b.p - a.p; });
    return raw;

      .then(function (rows) {
        approvedExamples = rows
          .filter(function (row) { return Array.isArray(row.features) && row.features.length === 34; })
          .map(function (row) { return { label: row.label, v: row.features }; });
      })
      .catch(function () { approvedExamples = []; });
  }

  function loadProfiles() {
    return fetch('profiles.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) { if (data && data.classes) profiles = data; })
      .catch(function () {});
  }

  Promise.all([loadProfiles(), loadApproved()]);

  function allExamples() {
    var base = profiles && profiles.examples ? profiles.examples : [];
    return base.concat(approvedExamples);
  }

  function loadFile(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { resolve({ img: img, url: url }); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('cannot open')); };
      img.src = url;
    });
  }

  $('photo').addEventListener('change', async function (event) {
    var file = event.target.files && event.target.files[0];
    if (!file) return;
    var obj;
    try { obj = await loadFile(file); }
    catch (e) { showMessage('Could not open this file.'); return; }

    lastVector = featuresOfImage(obj.img);
    var canvas = $('preview');
    var k = Math.min(1, 420 / Math.max(obj.img.width, obj.img.height));
    canvas.width = Math.round(obj.img.width * k);
    canvas.height = Math.round(obj.img.height * k);
    canvas.getContext('2d').drawImage(obj.img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(obj.url);

    withDoor(function () {
      canvas.style.display = 'block';
      renderResults();
    });
  });

  function showMessage(text) {
    $('results').innerHTML = '<div class="card"><p class="desc"></p></div>';
    $('results').querySelector('.desc').textContent = text;
  }

  function renderResults() {
    var box = $('results');
    if (!profiles) {
      showMessage('Profiles not found. Open the Setup tab, build profiles.json and put it next to this page.');
      return;
    }
    if (!lastVector) return;

    var ranked = predict(lastVector, profiles, allExamples());
    box.innerHTML = '';

    ranked.slice(0, 2).forEach(function (item, index) {
      var info = DESCRIPTIONS[item.label] || {};
      var cls = null;
      profiles.classes.forEach(function (c) { if (c.label === item.label) cls = c; });
      var pct = item.p * 100;

      var card = document.createElement('div');
      card.className = 'card fade-in' + (index === 0 ? ' top' : '');

      var head = document.createElement('div');
      head.className = 'head';
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = info.title || item.label;
      var p = document.createElement('span');
      p.className = 'pct';
      p.textContent = pct.toFixed(0) + '%';
      head.appendChild(name);
      head.appendChild(p);
      card.appendChild(head);

      var bar = document.createElement('div');
      bar.className = 'bar';
      var fill = document.createElement('i');
      fill.style.width = pct.toFixed(1) + '%';
      bar.appendChild(fill);
      card.appendChild(bar);

      var desc = document.createElement('p');
      desc.className = 'desc';
      desc.textContent = info.text || 'No description yet for this film.';
      card.appendChild(desc);

      if (cls) {
        var btn = document.createElement('button');
        btn.className = 'more';
        btn.textContent = 'Show details';
        card.appendChild(btn);

        var table = document.createElement('div');
        table.style.display = 'none';
        table.appendChild(buildTable(cls));
        card.appendChild(table);

        btn.addEventListener('click', function () {
          var open = table.style.display !== 'none';
          table.style.display = open ? 'none' : 'block';
          btn.textContent = open ? 'Show details' : 'Hide details';
        });
      }

      box.appendChild(card);
    });

    if (ranked.length > 2) {
      var rest = document.createElement('p');
      rest.className = 'note';
      rest.textContent = 'Other matches: ' + ranked.slice(2, 5).map(function (s) {
        var d = DESCRIPTIONS[s.label];
        return (d ? d.title : s.label) + ' ' + (s.p * 100).toFixed(0) + '%';
      }).join(' · ');
      box.appendChild(rest);
    }

    if (profiles.accuracy) {
      var acc = document.createElement('p');
      acc.className = 'note';
      acc.textContent = 'Archive check: the top match was correct in ' +
        Math.round(profiles.accuracy.top1 * 100) + '% of frames, and the film was in the top two in ' +
        Math.round(profiles.accuracy.top2 * 100) + '%. Approved visitor answers in the database: ' +
        approvedExamples.length + '.';
      box.appendChild(acc);
    }

    box.appendChild(buildFeedbackBlock(ranked));
  }

  function buildTable(cls) {
    var table = document.createElement('table');
    var head = document.createElement('tr');
    head.innerHTML = '<th>Feature</th><th>Film</th><th>Your frame</th><th>Match</th>';
    table.appendChild(head);

    var sum = 0, count = 0, i;
    for (i = 0; i < META.length; i++) {
      var name = META[i][0], title = META[i][1];
      var value = lastVector[i];
      var score = matchScore(value, cls.mean[i], cls.std[i], profiles.std[i]);
      sum += score; count++;

      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + title + '</td>' +
        '<td class="num">' + formatValue(name, cls.mean[i]) + '</td>' +
        '<td class="num">' + formatValue(name, value) + '</td>' +
        '<td class="num"><span class="mini"><i style="width:' + score.toFixed(0) + '%"></i></span>' +
        score.toFixed(0) + '%</td>';
      table.appendChild(tr);
    }

    var foot = document.createElement('tr');
    foot.innerHTML = '<td><b>Average match</b></td><td></td><td></td>' +
      '<td class="num"><b>' + (count ? (sum / count).toFixed(0) : '—') + '%</b></td>';
    table.appendChild(foot);
    return table;
  }

  function buildFeedbackBlock(ranked) {
    var wrap = document.createElement('div');
    wrap.className = 'fb';

    var q = document.createElement('p');
    q.textContent = 'Is this correct? Your answer will be reviewed and affects predictions after approval.';
    wrap.appendChild(q);

    var row = document.createElement('div');
    row.className = 'row';

    var topTitle = (DESCRIPTIONS[ranked[0].label] || {}).title || ranked[0].label;
    var yes = document.createElement('button');
    yes.className = 'btn';
    yes.textContent = 'Yes, it is ' + topTitle;
    row.appendChild(yes);

    var select = document.createElement('select');
    select.appendChild(new Option('No, it is a different film…', ''));
    profiles.classes.forEach(function (c) {
      select.appendChild(new Option((DESCRIPTIONS[c.label] || {}).title || c.label, c.label));
    });
    row.appendChild(select);

    var send = document.createElement('button');
    send.className = 'btn';
    send.textContent = 'Save';
    row.appendChild(send);

    wrap.appendChild(row);

    var msg = document.createElement('p');
    msg.className = 'note';
    wrap.appendChild(msg);

    function submit(label) {
      yes.disabled = true; send.disabled = true;
      msg.textContent = 'Sending...';
      sendFeedback(label, lastVector).then(function () {
        msg.textContent = 'Thank you. Your answer was sent for review and will affect predictions once approved.';
      }).catch(function (e) {
        msg.textContent = 'Could not send: ' + e.message;
        yes.disabled = false; send.disabled = false;
      });
    }

    yes.addEventListener('click', function () { submit(ranked[0].label); });
    send.addEventListener('click', function () {
      if (!select.value) { msg.textContent = 'Please choose a film from the list.'; return; }
      submit(select.value);
    });

    return wrap;
  }

  function sendFeedback(label, v) {
    var features = v.map(function (x) { return Math.round(x * 10000) / 10000; });
    return fetch(SUPABASE_URL + '/rest/v1/feedback', {
      method: 'POST',
      headers: supabaseHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
      body: JSON.stringify({ label: label, features: features, status: 'pending' })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
    });
  }

  var logBox = $('log');
  function log(text) {
    logBox.textContent += '\n' + text;
    logBox.scrollTop = logBox.scrollHeight;
  }

  $('build').addEventListener('click', async function () {
    var files = $('dir').files;
    if (!files || !files.length) { log('Please choose the photos folder first.'); return; }
    $('build').disabled = true;
    logBox.textContent = 'Starting analysis...';

    try {
      var items = [], seen = 0;
      for (var fi = 0; fi < files.length; fi++) {
        var file = files[fi];
        if (!/\.(jpe?g|png|webp)$/i.test(file.name)) continue;
        seen++;
        if (seen % 25 === 0) log('processed ' + seen + '...');
        var obj;
        try { obj = await loadFile(file); }
        catch (e) { log('skipped ' + file.name + ': ' + e.message); continue; }
        try { items.push({ label: labelOf(file.name), v: Array.from(featuresOfImage(obj.img)) }); }
        catch (e) { log('error ' + file.name + ': ' + e.message); }
        URL.revokeObjectURL(obj.url);
      }

      if (!items.length) { log('No photos found.'); return; }

      var byLabel = {};
      items.forEach(function (it) {
        if (!byLabel[it.label]) byLabel[it.label] = [];
        byLabel[it.label].push(it.v);
      });

      var allVectors = items.map(function (it) { return it.v; });
      var gMean = meanVec(allVectors);
      var gStd = stdVec(allVectors, gMean);

      var labels = Object.keys(byLabel).sort();
      var classes = labels.map(function (label) {
        var vectors = byLabel[label];
        var mean = meanVec(vectors);
        return { label: label, count: vectors.length, mean: mean, std: stdVec(vectors, mean) };
      });

      var pooled = new Array(gMean.length).fill(0), total = 0;
      classes.forEach(function (c) {
        for (var i = 0; i < c.std.length; i++) pooled[i] += c.std[i] * c.std[i] * c.count;
        total += c.count;
      });
      var weight = pooled.map(function (v) {
        var s = Math.sqrt(v / Math.max(1, total));
        return s < 1e-9 ? 1 : s;
      });

      var exampleList = items.map(function (it) {
        return { label: it.label, v: it.v.map(function (x) { return Math.round(x * 10000) / 10000; }) };
      });

      var prof = {
        version: 3,
        images: items.length,
        mean: gMean,
        std: gStd,
        weight: weight,
        classes: classes,
        examples: exampleList
      };

      var top1 = 0, top2 = 0, perClass = {};
      for (var a = 0; a < exampleList.length; a++) {
        var probe = exampleList[a];
        var others = [];
        for (var b = 0; b < exampleList.length; b++) {
          if (b === a) continue;
          others.push({ label: exampleList[b].label, d: distance(probe.v, exampleList[b].v, weight) });
        }
        others.sort(function (x, y) { return x.d - y.d; });
        var near = others.slice(0, K_NEIGHBOURS), votes = {}, tot = 0;
        near.forEach(function (s) {
          var w = 1 / (s.d + 1e-6);
          votes[s.label] = (votes[s.label] || 0) + w;
          tot += w;
        });
        var best = null, bestP = -1;
        Object.keys(votes).forEach(function (k) {
          if (votes[k] / tot > bestP) { bestP = votes[k] / tot; best = k; }
        });
        if (best === probe.label) top1++;
        if (near.slice(0, 2).some(function (s) { return s.label === probe.label; })) top2++;
        var rec = perClass[probe.label] || { ok: 0, n: 0 };
        rec.n++;
        if (best === probe.label) rec.ok++;
        perClass[probe.label] = rec;
      }

      prof.accuracy = {
        top1: top1 / exampleList.length,
        top2: top2 / exampleList.length,
        tested: exampleList.length
      };

      profiles = prof;
      $('download').disabled = false;

      log('');
      log('Photos: ' + items.length + ', films: ' + classes.length);
      log('Top match correct: ' + Math.round(prof.accuracy.top1 * 100) + '%');
      log('Film in top two: ' + Math.round(prof.accuracy.top2 * 100) + '%');
      log('');
      log('By film:');
      labels.forEach(function (label) {
        log('  ' + label + ': ' + perClass[label].ok + '/' + perClass[label].n);
      });
      log('');
      log('Done. Click "Download profiles.json".');
    } catch (e) {
      log('Error: ' + e.message);
    } finally {
      $('build').disabled = false;
    }
  });

  $('download').addEventListener('click', function () {
    if (!profiles) return;
    var blob = new Blob([JSON.stringify(profiles)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'profiles.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  });

  setTimeout(function () {
    setContentVisible(true);
    playDoor('open', 3100);
  }, 400);
})();
</script>
